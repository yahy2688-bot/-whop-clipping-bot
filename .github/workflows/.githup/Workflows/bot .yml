name: Whop Clipping Bot

on:
  schedule:
    - cron: '0 */4 * * *'  # يشتغل كل 4 ساعات تلقائيا
  workflow_dispatch:  # تقدر تشغله يدويا من جوالك بضغطة

jobs:
  hunt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install Tools (مجاني)
        run: |
          pip install playwright google-generativeai requests
          playwright install chromium
          
      - name: Run Whop Hunter
        env:
          WHOP_EMAIL: ${{ secrets.WHOP_EMAIL }}
          WHOP_PASS: ${{ secrets.WHOP_PASS }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_USER: ${{ secrets.TELEGRAM_USER }}
        run: |
          python main.py
          
      - name: Upload Screenshot
        uses: actions/upload-artifact@v4
        with:
          name: whop-screenshot
          path: campaigns.png
          
