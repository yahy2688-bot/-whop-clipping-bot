name: Whop Clipping Bot V2

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  hunt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          
      - name: Install Tools
        run: |
          pip install playwright google-genai requests pillow
          playwright install chromium --with-deps
          
      - name: Run Whop Hunter
        env:
          WHOP_EMAIL: ${{ secrets.WHOP_EMAIL }}
          WHOP_PASS: ${{ secrets.WHOP_PASS }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_USER: ${{ secrets.TELEGRAM_USER }}
        run: |
          python main.py
          
      - name: Upload Screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: whop-screenshot
          path: campaigns.png
          if-no-files-found: warn
          
