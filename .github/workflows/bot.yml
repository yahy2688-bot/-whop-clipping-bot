name: ClippingProfitBot
on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'
permissions:
  contents: write
jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests --quiet
      - run: python main.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_USER: ${{ secrets.TELEGRAM_USER }}
          WHOP_API_KEY: ${{ secrets.WHOP_API_KEY }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
      - name: Save history
        run: |
          git config user.name "bot"
          git config user.email "bot@bot.com"
          git add sent_campaigns.json || true
          git commit -m "update history" || true
          git push || true
