name: ClippingProfitBot
on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'الصق هنا رابط الفيديو (اختياري)'
        required: false
        type: string
      campaign_name:
        description: 'اسم الحملة'
        required: false
        default: 'Clipping Culture'
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: write

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: تثبيت أحدث yt-dlp (مهم عشان يتجاوز حظر يوتيوب)
        run: pip install -U yt-dlp requests gdown -q

      - name: تثبيت ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg -qq > /dev/null 2>&1

      - name: تشغيل المصنع
        run: python main.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_USER: ${{ secrets.TELEGRAM_USER }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          VIDEO_URL: ${{ inputs.video_url }}
          CAMPAIGN_NAME: ${{ inputs.campaign_name }}

      - name: حفظ السجل
        run: |
          git config user.name "bot"
          git config user.email "bot@bot.com"
          git add sent_campaigns.json || true
          git commit -m "update" || true
          git push || true
